name: Update Live Cricket Scores

on:
  workflow_dispatch: # Triggered reliably by cron-job.org every 20 mins
  schedule:
    - cron: '*/20 * * * *' # Backup GitHub schedule every 20 mins

permissions:
  contents: write

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live cricket data from CricketData API
        env:
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
        run: |
          curl -sS "https://api.cricapi.com/v1/currentMatches?apikey=${CRICKET_API_KEY}&offset=0" -o raw_scores.json
          python3 -c '
          import json, datetime
          with open("raw_scores.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("status") != "success":
              raise SystemExit(f"API error: {data}")
          data["last_updated_utc"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("scores.json", "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))
          '
          rm -f raw_scores.json

      - name: Commit and push scores.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live cricket scores"
            git push
          else
            echo "No score changes detected."
          fi
